<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>残響パズル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>残響パズル</h1>
      <p>1ターン遅れて動く「残響」と協力して、2つのスイッチを同時に押そう。</p>
    </header>

    <section class="panel status-panel" aria-live="polite">
      <div><strong>ステージ:</strong> <span id="stageLabel"></span></div>
      <div><strong>狙い:</strong> <span id="stageGoal"></span></div>
      <div><strong>操作:</strong> 矢印キー / WASDで移動、Rでリスタート</div>
    </section>

    <section class="game-layout">
      <div id="board" class="board" aria-label="ゲーム盤"></div>
      <aside class="panel legend">
        <h2>凡例</h2>
        <ul>
          <li><span class="chip player-chip"></span> プレイヤー</li>
          <li><span class="chip echo-chip"></span> 残響</li>
          <li><span class="chip wall-chip"></span> 壁</li>
          <li><span class="chip hole-chip"></span> 穴</li>
          <li><span class="chip switch-chip"></span> スイッチ</li>
          <li><span class="chip goal-chip"></span> ゴール表示</li>
          <li><span class="chip arrow-chip">→</span> 一方通行床</li>
        </ul>
        <p id="message" class="message"></p>
      </aside>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
