<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>残響パズル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>残響パズル</h1>
      <p>1ターン遅れで動く残響と協力して、2つのスイッチを同時に押そう。</p>
    </header>

    <section class="panel info" aria-live="polite">
      <p><strong>現在ステージ:</strong> <span id="stageLabel"></span></p>
      <p><strong>狙い:</strong> <span id="stageGoal"></span></p>
      <p><strong>操作:</strong> 矢印キー / WASDで移動、Rでリスタート</p>
      <p id="message" class="message"></p>
    </section>

    <section class="play-area">
      <div id="board" class="board" aria-label="ゲーム盤"></div>
      <aside class="panel legend">
        <h2>凡例</h2>
        <ul>
          <li><span class="sample player-sample"></span> プレイヤー</li>
          <li><span class="sample echo-sample"></span> 残響</li>
          <li><span class="sample wall-sample"></span> 壁</li>
          <li><span class="sample hole-sample"></span> 穴</li>
          <li><span class="sample switch-sample"></span> スイッチ</li>
          <li><span class="sample oneway-sample">→</span> 一方通行床</li>
        </ul>
      </aside>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
